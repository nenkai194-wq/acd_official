<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal Internal - ACD Digital Consulting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="deptech-hero-bg min-h-screen flex items-center justify-center p-4 text-white relative">
    <div class="deptech-grid-pattern"></div>
    <div class="max-w-md w-full bg-[#0d0f1a]/95 border border-indigo-950/80 rounded-3xl p-8 shadow-2xl relative z-10 backdrop-blur-md">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='images/logo_acd_icon.png') }}" alt="Logo ACD" class="h-16 w-auto mx-auto mb-3 drop-shadow-lg">
            <h2 class="text-xl font-bold text-white">Portal Staf & Administrator</h2>
            <p class="text-xs text-indigo-300 mt-1">PT. Aksara Cipta Digital (acd.co.id)</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Username Staf</label>
                <input type="text" name="username" required placeholder="admin" class="w-full px-4 py-3 text-sm bg-[#020617] border border-indigo-950 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 text-sm bg-[#020617] border border-indigo-950 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full py-3.5 deptech-btn-primary font-bold text-xs uppercase tracking-wider shadow-lg">
                Masuk ke Dashboard CMS
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-indigo-950/80 text-center">
            <a href="{{ url_for('index') }}" class="text-xs text-slate-400 hover:text-white transition">
                &larr; Kembali ke Website Publik acd.co.id
            </a>
        </div>
    </div>
</body>
</html>
